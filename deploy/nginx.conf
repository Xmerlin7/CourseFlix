server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — client-side routing serves index.html for unknown paths.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed static assets are immutable.
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
  }
}

<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CourseFlix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Cairo stays the default (--sans in index.css); the other four are
         only fetched for users who pick them in Settings > Appearance —
         see useFontFamily.ts. -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" rel="stylesheet">
    <!-- Runs before first paint so there's no flash of the wrong theme/accent/corners/
         font/scale while React hydrates. Mirrors what useTheme/useAccentColor/
         useCornerStyle/useReducedMotion/useFontFamily/useUiScale apply after mount —
         keep all of them in sync if the storage keys, value sets, or accent-theme.ts's
         tone formula ever change. data-ui-scale here only sets the attribute; the
         actual zoom is a CSS rule scoped to .sheet/.sidebar in index.css, not :root. -->
    <script>(function(){try{
      var theme=localStorage.getItem('cf-theme');
      var isDark=theme==='dark'||((!theme||theme==='system')&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
      if(isDark)document.documentElement.classList.add('dark');

      var corners=localStorage.getItem('cf-corners');
      if(corners&&corners!=='default')document.documentElement.setAttribute('data-corners',corners);

      if(localStorage.getItem('cf-reduce-motion')==='1')document.documentElement.setAttribute('data-reduce-motion','1');

      var density=localStorage.getItem('cf-density');
      if(density&&density!=='comfortable')document.documentElement.setAttribute('data-density',density);

      var font=localStorage.getItem('cf-font');
      if(font&&font!=='cairo')document.documentElement.setAttribute('data-font',font);

      var uiScale=localStorage.getItem('cf-ui-scale');
      if(uiScale==='small'||uiScale==='large'){
        document.documentElement.setAttribute('data-ui-scale',uiScale);
      }

      var seed=localStorage.getItem('cf-accent-hex');
      if(seed&&/^#[0-9a-fA-F]{6}$/.test(seed)&&seed.toLowerCase()!=='#65558f'){
        function ch(hex,i){return parseInt(hex.slice(1+i*2,3+i*2),16)}
        function contrastOn(hex){
          var b=(ch(hex,0)*299+ch(hex,1)*587+ch(hex,2)*114)/1000;
          return b>=150?'#1D1B20':'#FFFFFF';
        }
        function mix(hex,pct,base){
          var p=pct/100, bv=base==='white'?255:0;
          function c(i){return Math.max(0,Math.min(255,Math.round(ch(hex,i)*p+bv*(1-p)))).toString(16).padStart(2,'0')}
          return '#'+c(0)+c(1)+c(2);
        }
        // Applied via style.setProperty(..., 'important') directly on
        // <html>, not a <style> tag — an inline style has no selector,
        // so there's no specificity/layer/DOM-order contest to lose
        // against index.css's own default :root/:root.dark blocks (a
        // <style> tag's :root/:root.dark selectors turned into a
        // genuinely fragile fight across several rounds). See
        // accent-theme.ts's buildAccentVars — same math, kept in sync.
        var vars;
        if(isDark){
          var darkPrimary=mix(seed,55,'white');
          vars={
            'accent-seed':seed,'primary':darkPrimary,'on-primary':contrastOn(darkPrimary),
            'primary-container':mix(seed,38,'black'),'on-primary-container':mix(seed,20,'white'),
            'secondary-container':mix(seed,38,'black'),'on-secondary-container':mix(seed,20,'white'),
            'tertiary-container':mix(seed,38,'black'),'on-tertiary-container':mix(seed,20,'white'),
            'bg':mix(seed,15,'black'),'surface':mix(seed,18,'black'),
            'surface-container-low':mix(seed,21,'black'),'surface-container':mix(seed,24,'black'),
            'surface-container-high':mix(seed,27,'black'),'surface-container-highest':mix(seed,31,'black'),
            'on-surface':mix(seed,12,'white'),'on-surface-variant':mix(seed,28,'white'),
            'outline':mix(seed,24,'white'),'outline-variant':mix(seed,16,'black'),
            'logo':mix(seed,65,'white'),'nav-active':mix(seed,20,'white')
          };
        }else{
          vars={
            'accent-seed':seed,'primary':seed,'on-primary':contrastOn(seed),
            'primary-container':mix(seed,20,'white'),'on-primary-container':mix(seed,75,'black'),
            'secondary-container':mix(seed,20,'white'),'on-secondary-container':mix(seed,75,'black'),
            'tertiary-container':mix(seed,20,'white'),'on-tertiary-container':mix(seed,75,'black'),
            'bg':mix(seed,8,'white'),'surface':mix(seed,3,'white'),
            'surface-container-low':mix(seed,10,'white'),'surface-container':mix(seed,13,'white'),
            'surface-container-high':mix(seed,16,'white'),'surface-container-highest':mix(seed,19,'white'),
            'on-surface':mix(seed,9,'black'),'on-surface-variant':mix(seed,48,'black'),
            'outline':mix(seed,28,'black'),'outline-variant':mix(seed,18,'white'),
            'logo':mix(seed,78,'black'),'nav-active':mix(seed,70,'black')
          };
        }
        for(var k in vars){
          document.documentElement.style.setProperty('--'+k, vars[k], 'important');
        }
      }
    }catch(e){}})();</script>
  </head>
  <body class="shell">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

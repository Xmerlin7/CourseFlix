<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CourseFlix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Cairo stays the default (--sans in index.css); the other four are
         only fetched for users who pick them in Settings > Appearance —
         see useFontFamily.ts. -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" rel="stylesheet">
    <!-- Runs before first paint so there's no flash of the wrong theme/accent/corners/
         font/scale while React hydrates. Mirrors what useTheme/useAccentColor/
         useCornerStyle/useReducedMotion/useFontFamily/useUiScale apply after mount —
         keep all of them in sync if the storage keys, value sets, or accent-theme.ts's
         tone formula ever change. data-ui-scale here only sets the attribute; the
         actual zoom is a CSS rule scoped to .sheet/.sidebar in index.css, not :root. -->
    <script>(function(){try{
      var theme=localStorage.getItem('cf-theme');
      var isDark=theme==='dark'||((!theme||theme==='system')&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
      if(isDark)document.documentElement.classList.add('dark');

      var corners=localStorage.getItem('cf-corners');
      if(corners&&corners!=='default')document.documentElement.setAttribute('data-corners',corners);

      if(localStorage.getItem('cf-reduce-motion')==='1')document.documentElement.setAttribute('data-reduce-motion','1');

      var density=localStorage.getItem('cf-density');
      if(density&&density!=='comfortable')document.documentElement.setAttribute('data-density',density);

      var font=localStorage.getItem('cf-font');
      if(font&&font!=='cairo')document.documentElement.setAttribute('data-font',font);

      var uiScale=localStorage.getItem('cf-ui-scale');
      if(uiScale==='small'||uiScale==='large'){
        document.documentElement.setAttribute('data-ui-scale',uiScale);
      }

      var seed=localStorage.getItem('cf-accent-hex');
      if(seed&&/^#[0-9a-fA-F]{6}$/.test(seed)&&seed.toLowerCase()!=='#65558f'){
        function ch(hex,i){return parseInt(hex.slice(1+i*2,3+i*2),16)}
        function contrastOn(hex){
          var b=(ch(hex,0)*299+ch(hex,1)*587+ch(hex,2)*114)/1000;
          return b>=150?'#1D1B20':'#FFFFFF';
        }
        function mix(hex,pct,base){
          var p=pct/100, bv=base==='white'?255:0;
          function c(i){return Math.max(0,Math.min(255,Math.round(ch(hex,i)*p+bv*(1-p)))).toString(16).padStart(2,'0')}
          return '#'+c(0)+c(1)+c(2);
        }
        function tone(pct,base){return 'color-mix(in srgb, var(--accent-seed) '+pct+'%, '+base+')'}
        // !important on every declaration — the definitive fix, not just
        // a specificity trick. index.css's own default :root/:root.dark
        // blocks are unlayered author CSS too, so a plain specificity/
        // DOM-order edge (whichever <style> tag lands later in <head>)
        // was enough to make the accent silently lose after a refresh,
        // and made light/dark values leak into the wrong mode depending
        // on load timing. See accent-theme.ts's buildAccentCss.
        function d(name,value){return '--'+name+':'+value+' !important;'}
        var onPrimaryLight=contrastOn(seed);
        var onPrimaryDark=contrastOn(mix(seed,55,'white'));
        var css=':root {'
          +d('accent-seed',seed)+d('primary','var(--accent-seed)')+d('on-primary',onPrimaryLight)
          +d('primary-container',tone(20,'white'))+d('on-primary-container',tone(75,'black'))
          +d('secondary-container',tone(20,'white'))+d('on-secondary-container',tone(75,'black'))
          +d('tertiary-container',tone(20,'white'))+d('on-tertiary-container',tone(75,'black'))
          +d('bg',tone(8,'white'))+d('surface',tone(3,'white'))
          +d('surface-container-low',tone(10,'white'))+d('surface-container',tone(13,'white'))
          +d('surface-container-high',tone(16,'white'))+d('surface-container-highest',tone(19,'white'))
          +d('on-surface',tone(9,'black'))+d('on-surface-variant',tone(48,'black'))
          +d('outline',tone(28,'black'))+d('outline-variant',tone(18,'white'))
          +d('logo',tone(78,'black'))+d('nav-active',tone(70,'black'))
          +'}:root.dark {'
          +d('accent-seed',seed)+d('primary',tone(55,'white'))+d('on-primary',onPrimaryDark)
          +d('primary-container',tone(38,'black'))+d('on-primary-container',tone(20,'white'))
          +d('secondary-container',tone(38,'black'))+d('on-secondary-container',tone(20,'white'))
          +d('tertiary-container',tone(38,'black'))+d('on-tertiary-container',tone(20,'white'))
          +d('bg',tone(24,'black'))+d('surface',tone(18,'black'))
          +d('surface-container-low',tone(21,'black'))+d('surface-container',tone(24,'black'))
          +d('surface-container-high',tone(27,'black'))+d('surface-container-highest',tone(31,'black'))
          +d('on-surface',tone(12,'white'))+d('on-surface-variant',tone(28,'white'))
          +d('outline',tone(24,'white'))+d('outline-variant',tone(16,'black'))
          +d('logo',tone(65,'white'))+d('nav-active',tone(20,'white'))
          +'}';
        var styleEl=document.createElement('style');
        styleEl.id='cf-accent-style';
        styleEl.textContent=css;
        document.head.appendChild(styleEl);
      }
    }catch(e){}})();</script>
  </head>
  <body class="shell">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

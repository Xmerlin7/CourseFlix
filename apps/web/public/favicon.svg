<!-- CourseFlix mark: a purple C.

     Drawn as a stroked arc rather than a <text> glyph — a favicon is
     rendered without the page's fonts loaded, so a text-based mark falls
     back to whatever the OS picks and the weight/shape changes per
     platform. The pale tile behind it keeps the C legible in both a
     light and a dark browser tab, where a bare purple stroke on
     transparent would disappear into one or the other. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#EDE6FF" />
  <path
    d="M42.93 18.98 A17 17 0 1 0 42.93 45.02"
    fill="none"
    stroke="#6C4BD8"
    stroke-width="10"
    stroke-linecap="round"
  />
</svg>
